# Sunveil — systemd user drop-in for Sunshine.
#
# WHY THIS EXISTS
# On an autologin / fast-boot CachyOS box, the Sunshine user service can start in
# the same instant KWin Wayland is still coming up. When that happens Sunshine
# creates its virtual uinput device before KWin can bind the pointer's *button*
# capabilities — the classic "cursor moves but clicks do nothing" bug. Waiting
# for KWin to actually be running before Sunshine starts makes the input device
# attach correctly every boot.
#
# This drop-in replaces Sunshine's fixed `sleep 5` pre-start with a bounded poll
# that returns as soon as kwin_wayland is alive (typically 1-3 s), capped at 30 s.

[Service]
# clear the packaged ExecStartPre (the fixed sleep) before adding ours
ExecStartPre=
ExecStartPre=/usr/bin/bash -lc 'for i in $(seq 1 60); do pgrep -x kwin_wayland >/dev/null && exit 0; sleep 0.5; done; exit 0'
