# Sunveil configuration
# Sourced by the stream-start / stream-end hooks. Plain shell assignments.
# After editing, no restart is needed — hooks read this on every stream.

# Name of the virtual monitor. KWin exposes it to kscreen as "Virtual-<VM_NAME>".
# If you change this, also update `output_name` in sunshine.conf to match
# "Virtual-<VM_NAME>" (the installer keeps them in sync for you).
VM_NAME="sunshine-vm"

# Turn the physical monitors OFF while streaming (true), or leave them ON so the
# virtual display is an extra screen alongside them (false).
#   true  = headless "monitors off" mode (default, matches the project's purpose)
#   false = coexist / extend mode (physical monitors keep showing your desktop)
DISABLE_PHYSICAL=true

# Fallback resolution/fps if the Moonlight client doesn't report one.
FALLBACK_WIDTH=1920
FALLBACK_HEIGHT=1080
FALLBACK_FPS=60

# VNC password/port that krfb-virtualmonitor requires as arguments.
# Moonlight never uses these — they exist only because krfb demands them.
# The port is bound on localhost; pick anything free if 5905 clashes.
VNC_PASSWORD="sunshine"
VNC_PORT=5905

# Extra kscreen-doctor arguments applied to the virtual output AFTER it is
# created, e.g. scaling for HiDPI clients. Leave empty for none.
# Example: EXTRA_VM_KSCREEN=("output.VM.scale.2")   # VM is replaced with real name
EXTRA_VM_KSCREEN=()
